name: Framework OODA build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
permissions:
  contents: read
concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build tooling
        run: python -m pip install setuptools==84.1.0 wheel==0.48.0
      - name: Observe, orient, decide, act, verify and record learning
        run: python scripts/ooda_cycle.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ooda-${{ matrix.python }}
          path: cycle-result.json
          if-no-files-found: error
          retention-days: 14
