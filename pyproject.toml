[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "govdoss-kis4"
version = "0.1.0"
description = "GovDOSS KIS4 offline evidence assessment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kis4 = "kis4.__main__:main"

[tool.setuptools.packages.find]
include = ["kis4*"]
